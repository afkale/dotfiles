# tmux — the thin multiplexer.
#
# Prefix M-space, for layout verbs only (splits, zoom, close, copy mode,
# reload). Everything you do constantly is a direct chord: M-w, M-C-w, M-d.
# Agentic work lives in agent-manager, not here.

%hidden TMUX_SCRIPTS="$HOME/.config/tmux/scripts"
%hidden PANE_SCRIPT="$TMUX_SCRIPTS/panes.sh"
%hidden POPUP_SCRIPT="$TMUX_SCRIPTS/popup.sh"

# ---------------------------------------------------------------------------
# Core
# ---------------------------------------------------------------------------
set -g prefix M-space
set -g mouse on
set -g status on
set -g status-position bottom

# Windows and panes both start at 1.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g bell-action none

run-shell -b 'mkdir -p "$HOME/.local/state/tmux"'
set -g history-file ~/.local/state/tmux/history
set -g mode-keys vi
set -g focus-events on
set -sg escape-time 10
set -g set-clipboard on

set -a terminal-features "tmux-256color:RGB"
set -a terminal-overrides "tmux-256color:Tc"

# Let programs (yazi) query the real terminal through tmux. Without this tmux
# swallows the query, so yazi waits out its 5s probe timeout on every quit.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ---------------------------------------------------------------------------
# Status bar — Rose Pine (main), session + current window, nothing else
# ---------------------------------------------------------------------------
set -g status-interval 5
set -g status-style "bg=default,fg=#908caa"
set -g status-left-length 60
set -g status-right-length 60

# The logo turns gold while the prefix is pressed, iris otherwise.
set -g status-left " #[fg=#{?client_prefix,#f6c177,#c4a7e7},bold]  #[fg=#e0def4,bold]#S #[fg=#403d52]│ #[fg=#c4a7e7]#{window_index}:#{window_name}#{?window_zoomed_flag, ,} "
set -g window-status-separator ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-right "#[fg=#9ccfd8]#{?window_zoomed_flag,zoomed ,}#[fg=#6e6a86]#{pane_current_command} "

# ---------------------------------------------------------------------------
# Messages, command prompts, copy mode and popups
# ---------------------------------------------------------------------------
set -g message-style "bg=#26233a,fg=#e0def4,align=centre,width=50%"
set -g message-command-style "bg=#26233a,fg=#c4a7e7,align=centre,width=50%"
set -g mode-style "bg=#524f67,fg=#e0def4"

set -g pane-border-style "fg=#403d52"
set -g pane-active-border-style "fg=#c4a7e7"
set -g display-panes-colour "#403d52"
set -g display-panes-active-colour "#c4a7e7"
set -g clock-mode-colour "#c4a7e7"

set -g popup-border-style "fg=#524f67"
set -g popup-border-lines "rounded"
set -g popup-style "bg=#191724,fg=#e0def4"

# ---------------------------------------------------------------------------
# Create — names are the point, so both prompts pre-fill the directory name
# ---------------------------------------------------------------------------
# New window in the current session.
bind -n M-w new-window -c "#{pane_current_path}" \; \
  command-prompt -I "#{b:pane_current_path}" "rename-window '%%'"

# New session with its first window; prompts for the session, then the window.
bind -n M-C-w new-session -c "#{pane_current_path}" \; \
  command-prompt -I "#{b:pane_current_path}" "rename-session '%%'" \; \
  command-prompt -I "#{b:pane_current_path}" "rename-window '%%'"

# ---------------------------------------------------------------------------
# Rename
# ---------------------------------------------------------------------------
bind -n M-r command-prompt -I "#{window_name}" "rename-window '%%'"
bind -n M-C-r command-prompt -I "#{session_name}" "rename-session '%%'"

# ---------------------------------------------------------------------------
# Movement
# ---------------------------------------------------------------------------
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-v copy-mode
bind -n M-s if -F '#{==:#{status},on}' 'set -g status off' 'set -g status on'

# Pane picker: every pane in every session, agent-manager sessions skipped.
bind -n M-d display-popup -B -E -w 90% -h 80% "$PANE_SCRIPT pick"

# ---------------------------------------------------------------------------
# Layout (prefix only)
# ---------------------------------------------------------------------------
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind o select-pane -t :.+
bind z resize-pane -Z
bind x kill-pane
bind [ copy-mode

# Reload the whole config.
unbind r
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux: reloaded"

# ---------------------------------------------------------------------------
# Tool popups
# ---------------------------------------------------------------------------
# Isolated popup: own tmux socket, no status bar, only M-1 bound (detach).
bind -n M-1 display-popup -d '#{pane_current_path}' -xC -yC -w 80% -h 75% -E "$POPUP_SCRIPT"

bind -n M-y display-popup -d '#{pane_current_path}' -E -w 100% -h 100% -T '    yazi ' yazi
bind -n M-g display-popup -d '#{pane_current_path}' -E -w 100% -h 100% -T '    lazygit ' lazygit
bind -n M-b display-popup -d '#{pane_current_path}' -E -w 100% -h 100% -T '    btop ' btop

# ---------------------------------------------------------------------------
# Copy mode: vi keys, selection straight to the system clipboard
# ---------------------------------------------------------------------------
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
  "wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || cat >/dev/null"
bind-key -T copy-mode-vi Escape send-keys -X cancel
