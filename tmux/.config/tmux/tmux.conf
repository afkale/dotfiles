# tmux entrypoint — modules live in conf/, helper commands in scripts/.

%hidden TMUX_CONFIG_HOME="$HOME/.config/tmux"
%hidden TMUX_SCRIPTS="$TMUX_CONFIG_HOME/scripts"
%hidden PANE_SCRIPT="$TMUX_SCRIPTS/pane.sh"
%hidden SESSIONS_SCRIPT="$TMUX_SCRIPTS/sessions.sh"
%hidden POPUP_SCRIPT="$TMUX_SCRIPTS/popup.sh"
%hidden AI_SCRIPT="$TMUX_SCRIPTS/ai.sh"
%hidden STREAMUX_SCRIPT="$TMUX_SCRIPTS/streamux.sh"
%hidden WORKTREE_SCRIPT="$TMUX_SCRIPTS/worktree.sh"

source-file "$TMUX_CONFIG_HOME/conf/base.tmux"
source-file "$TMUX_CONFIG_HOME/conf/status.tmux"
source-file "$TMUX_CONFIG_HOME/conf/keys.tmux"
source-file "$TMUX_CONFIG_HOME/conf/popups.tmux"
source-file "$TMUX_CONFIG_HOME/conf/hooks.tmux"

# Reload everything (prefix + r).
unbind r
bind r source-file "$TMUX_CONFIG_HOME/tmux.conf"
