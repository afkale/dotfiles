onboarding = false

[ui]
# Only the single-tab case is hideable in herdr; the row returns with 2+ tabs.
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "terminal"

[theme]
name = "rose-pine"
auto_switch = false

# tmux-parity keymap. Prefix alt+space mirrors the old tmux prefix; ctrl+space
# is the fallback for window managers that eat Alt+Space.
[keys]
prefix = ["alt+space", "ctrl+space"]

# Navigate mode: h/l would ideally move workspaces left/right,
# but that config key doesn't exist yet (requested in
# https://github.com/herdrdev/herdr/discussions/5415).
# For now j/k move workspace selection, arrows focus panes.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
help = ["prefix+?", "alt+?"]
detach = "prefix+d"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
new_workspace = ["prefix+shift+n", "ctrl+alt+w"]
new_tab = ["prefix+c", "alt+w"]
rename_tab = ["prefix+,", "alt+r"]
rename_workspace = ["prefix+shift+w", "ctrl+alt+r"]
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
close_tab = "prefix+&"
close_pane = "prefix+x"
zoom = "prefix+z"
split_vertical = "prefix+%"
split_horizontal = "prefix+\""
cycle_pane_next = "prefix+o"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
copy_mode = ["prefix+[", "alt+v"]
toggle_sidebar = ["prefix+b", "alt+s"]
goto = ["prefix+g", "alt+d"]
open_notification_target = ""

# Direct popup chords carried over from the tmux map (M-g, M-y, M-p).
[[keys.command]]
key = "alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "100%"
height = "100%"

[[keys.command]]
key = "alt+y"
type = "popup"
command = "yazi"
description = "yazi"
width = "100%"
height = "100%"

[[keys.command]]
key = "alt+p"
type = "popup"
command = "btop"
description = "btop"
width = "100%"
height = "100%"
