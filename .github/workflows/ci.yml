name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck -x $(git ls-files '*.sh')

  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git stow fish tmux fzf fd-find ripgrep bat \
            jq lazygit btop yazi less python3 tree-sitter-cli 2>/dev/null || true
          # Provide fd under its expected name.
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd 2>/dev/null || true
      - name: Run doctor
        run: bash scripts/doctor.sh --server