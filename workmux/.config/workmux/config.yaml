# Global workmux configuration.
#
# A task is created with `workmux add <branch>` and lives in the session it was
# called from. Checkouts keep the old shape:
#
#   ~/worktrees/<project>/<branch with slashes replaced by dashes>
#
# Project-specific behaviour belongs in a tracked .workmux.yaml; this file is
# the dotfiles-managed default for every repository.

# We use Nerd Fonts in the tmux status bar, so workmux can render them too.
nerdfont: true

# Disable auto-format rewriting: we manage the tmux status bar ourselves.
# The agent status icon is rendered as #{@workmux_status} in status-left.
status_format: false

# Use Nerd Font icons instead of emoji for agent status.
status_icons:
  working: ''   # nf-fa-gear (spinning)
  waiting: ''   # nf-fa-info_circle
  done: ''      # nf-fa-check

# One task per window, in the current tmux session.
mode: window

# Keep the existing checkout root and namespace it by project.
worktree_dir: ~/worktrees/{project}

# Full keeps the whole branch name: feature/login becomes feature-login.
worktree_naming: full

# Empty prefix: the window name is just the worktree handle with no decoration.
# The dashboard and sidebar already identify worktrees unambiguously.
window_prefix: ""

# One full-view pane: the agent, and no extra split.
agent: opencode
panes:
  - command: <agent>
    focus: true

# Worktrees are clean checkouts, so carry over the same local env files the
# worktree script (worktree.sh) copies. .envrc is deliberately absent: it may
# execute on cd. Owner-only permissions (600) keep secrets from leaking.
files:
  copy:
    - .env
    - .env.local
    - .env.development.local

# The env files in files.copy end up with the worktree's default umask.
# This hook enforces owner-only (600) regardless of the creating process.
# Both lists (files.copy and this loop) must stay in sync.
post_create:
  # Fresh worktrees have no submodule checkouts. A repository without
  # .gitmodules is not an error.
  - 'if [ -f .gitmodules ]; then git submodule update --init --recursive; fi'
  # Enforce owner-only on the copied env files.
  - 'for f in .env .env.local .env.development.local; do if [ -f "$f" ]; then chmod 600 "$f"; fi; done'
