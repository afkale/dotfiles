default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x
        language: system
        types: [shell]
        stages: [pre-push]

      - id: doctor
        name: make doctor
        entry: scripts/doctor.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
